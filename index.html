<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Punto de Venta</title>
    <meta name="description" content="Sistema de punto de venta: ventas, mesas, domicilios, caja, inventario y contabilidad." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#111111" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Punto de Venta" />
    <meta property="og:description" content="Ventas, mesas, domicilios, caja, inventario y contabilidad." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Marca del negocio guardada en este equipo: título, colores, fuentes y favicon se aplican antes de que cargue la app
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('pos-brand-cache') || 'null');
          if (!c) return;
          if (c.title) document.title = c.title;
          var root = document.documentElement;
          if (c.css) root.setAttribute('style', c.css);
          if (c.dark) root.classList.add('dark');
          if (c.favicon) { var l = document.querySelector('link[rel="icon"]'); if (l) { l.href = c.favicon; l.type = /\.svg$/.test(c.favicon) ? 'image/svg+xml' : 'image/png'; } }
          if (c.themeColor) { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = c.themeColor; }
          (c.fonts || []).forEach(function (href) { var k = document.createElement('link'); k.rel = 'stylesheet'; k.href = href; document.head.appendChild(k); });
        } catch (e) { /* sin caché */ }
      })();
    </script>
  </head>

  <body class="bg-background text-foreground antialiased selection:bg-brand-accent/30 selection:text-brand-primary">
    <div id="root"></div>
    <div id="pos-thermal-print-area"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
